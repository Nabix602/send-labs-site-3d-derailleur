<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact – SendLabs</title>
<meta name="description" content="Écrire à l'atelier SendLabs : question, compatibilité, conseil.">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="static">
<header id="site-header"></header>
<main class="wrap">
<div class="page-title"><h1>Écrire à l'atelier</h1><p>Question, compatibilité, ou envie d'être prévenu pour le garde-boue ?</p></div>
<section class="block">
<form data-submit="contact" data-success="Merci ! Votre message est bien arrivé, on vous répond rapidement.">
  <p hidden><label>Ne pas remplir <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
  <label>Nom ou pseudo<input name="nom" required maxlength="120"></label>
  <label>E-mail<input type="email" name="email" required maxlength="200"></label>
  <label>Sujet<select name="sujet"><option>Question sur un produit</option><option>Compatibilité</option><option>Me prévenir pour le garde-boue</option><option>Autre</option></select></label>
  <label>Message<textarea name="message" rows="5" required maxlength="800"></textarea></label>
  <label class="check"><input type="checkbox" name="consentement" value="oui" required> J'accepte que mes données soient utilisées pour répondre à ma demande (voir la <a href="confidentialite.html" style="text-decoration:underline">politique de confidentialité</a>).</label>
  <button class="btn" type="submit">Envoyer</button>
</form>
<p style="text-align:center;color:var(--muted);margin-top:24px">Ou par e-mail : <a data-email style="text-decoration:underline" href="#"></a></p>
</section></main>
<footer id="site-footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="pages.js"></script>
</body>
</html>
