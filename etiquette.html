<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartes surprise à imprimer – SendLabs</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.png" type="image/png">
<style>
body{font-family:Inter,system-ui,sans-serif;margin:0;padding:20px;color:#0F1115;background:#fff}
.bar{max-width:900px;margin:0 auto 20px}.bar button,.bar a{font:inherit;padding:10px 16px;border-radius:8px;border:0;background:#0F1115;color:#B9F000;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.pick{border:1px solid #ddd;border-radius:8px;padding:8px;max-height:260px;overflow:auto;margin:12px 0}.pick label{display:block;padding:3px 0}
.sheet{display:grid;grid-template-columns:repeat(2,90mm);gap:0;justify-content:center}
.card{width:90mm;height:55mm;box-sizing:border-box;border:.3mm dashed #999;padding:4mm;display:flex;gap:4mm;align-items:center;background:#0F1115;color:#fff;page-break-inside:avoid;overflow:hidden}
.card .qr{background:#fff;padding:2mm;width:37mm;height:37mm;flex:none}.card .qr svg{width:100%;height:100%;display:block}
.card h2{margin:0 0 2mm;font-size:5.4mm;line-height:1.05;text-transform:uppercase;font-style:italic}.card h2 span{color:#B9F000}
.card p{margin:0;font-size:2.9mm;line-height:1.3}.card small{display:block;margin-top:2mm;color:#B9F000;font-size:2.4mm}
@media print{.bar{display:none}body{padding:0}@page{size:A4;margin:10mm 10mm}}
</style>
</head>
<body>
<div class="bar"><h1>Cartes « Ta surprise » avec QR unique par colis</h1><div id="msg">Chargement…</div><div id="pick" class="pick" hidden></div><button id="go" hidden>Générer les cartes</button> <button id="print" hidden onclick="window.print()">Imprimer (A4, 10 cartes par page)</button></div>
<div class="sheet" id="sheet"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="qr.js"></script>
<script src="etiquette.js"></script>
</body></html>
